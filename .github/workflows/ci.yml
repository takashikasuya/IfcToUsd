name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync

      - name: Install Playwright browsers
        run: uv run playwright install --with-deps chromium

      - name: Run tests
        run: uv run pytest -q

      - name: Run fixture performance benchmark
        run: uv run ifc2usd benchmark tests/fixtures/minimal.ifc -o output/ci-benchmark

      - name: Upload fixture performance report
        uses: actions/upload-artifact@v4
        with:
          name: fixture-performance-${{ github.sha }}
          path: output/ci-benchmark/
          retention-days: 14
